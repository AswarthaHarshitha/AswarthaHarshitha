<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Aswartha Harshitha Sugreevu — Computer Science Engineer building intelligent systems and the software around them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.55" stop-color="#0b1024"/>
      <stop offset="1" stop-color="#170d2e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#3b5bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b5bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#b44cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#b44cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dfe6ff"/>
      <stop offset="1" stop-color="#c9a8ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9aa7ff"/>
      <stop offset="1" stop-color="#c38bff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fa0ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .star{animation:tw 5s ease-in-out infinite}
      .s2{animation-delay:1.3s}.s3{animation-delay:2.6s}.s4{animation-delay:3.9s}
      @keyframes tw{0%,100%{opacity:.25}50%{opacity:.9}}
      .edge{stroke-dasharray:4 6;animation:flow 14s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-200}}
      .node{animation:pulse 4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
    </style>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="18" fill="url(#glowA)"/>
  <rect width="1200" height="420" rx="18" fill="url(#glowB)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle class="star" cx="92" cy="58" r="1.2"/>
    <circle class="star s2" cx="260" cy="30" r="1"/>
    <circle class="star s3" cx="410" cy="372" r="1.1"/>
    <circle class="star s4" cx="640" cy="44" r="1"/>
    <circle class="star s2" cx="760" cy="388" r="1.2"/>
    <circle class="star" cx="1120" cy="60" r="1.1"/>
    <circle class="star s3" cx="1160" cy="330" r="1"/>
    <circle class="star s4" cx="48" cy="300" r="1"/>
    <circle class="star s2" cx="540" cy="18" r="0.9"/>
  </g>

  <!-- system graph: data → model → service → product -->
  <g transform="translate(830 105)">
    <g stroke="#9aa7ff" stroke-opacity="0.45" stroke-width="1.2" fill="none">
      <path class="edge" d="M20 40 L120 20"/>
      <path class="edge" d="M20 40 L110 120"/>
      <path class="edge" d="M120 20 L230 70"/>
      <path class="edge" d="M110 120 L230 70"/>
      <path class="edge" d="M230 70 L320 30"/>
      <path class="edge" d="M230 70 L310 170"/>
      <path class="edge" d="M110 120 L190 200"/>
      <path class="edge" d="M190 200 L310 170"/>
    </g>
    <g>
      <circle class="node" cx="20" cy="40" r="5" fill="#7c8cff"/>
      <circle class="node s2" cx="120" cy="20" r="4" fill="#9aa7ff"/>
      <circle class="node s3" cx="110" cy="120" r="5" fill="#8a7dff"/>
      <circle class="node" cx="230" cy="70" r="7" fill="#c38bff"/>
      <circle class="node s4" cx="320" cy="30" r="4" fill="#9aa7ff"/>
      <circle class="node s2" cx="310" cy="170" r="5" fill="#b77dff"/>
      <circle class="node s3" cx="190" cy="200" r="4" fill="#7c8cff"/>
      <circle cx="230" cy="70" r="16" fill="none" stroke="#c38bff" stroke-opacity="0.35"/>
    </g>
    <g font-size="11" fill="#aab3d9" fill-opacity="0.75" letter-spacing="1.5">
      <text x="0" y="68">DATA</text>
      <text x="90" y="145">MODELS</text>
      <text x="205" y="105">SERVICES</text>
      <text x="282" y="200">PRODUCT</text>
    </g>
  </g>

  <!-- copy -->
  <g>
    <text x="72" y="118" font-size="14" fill="#9aa7ff" letter-spacing="5" font-weight="600">COMPUTER SCIENCE ENGINEER</text>
  </g>
  <g>
    <text x="70" y="186" font-size="56" font-weight="800" fill="url(#name)" letter-spacing="-1">Aswartha Harshitha</text>
    <text x="72" y="236" font-size="56" font-weight="300" fill="#e8ecff" fill-opacity="0.92" letter-spacing="-1">Sugreevu</text>
  </g>
  <g>
    <rect x="72" y="262" width="420" height="1.5" fill="url(#rule)"/>
    <text x="72" y="298" font-size="20" fill="#cfd6f5">I build intelligent systems — and the software around them.</text>
  </g>
  <g>
    <text x="72" y="340" font-size="14" fill="#8e98c4" letter-spacing="1.2">APPLIED AI / ML   ·   BACKEND &amp; APIs   ·   FULL-STACK   ·   INTELLIGENT AUTOMATION</text>
  </g>
</svg>
