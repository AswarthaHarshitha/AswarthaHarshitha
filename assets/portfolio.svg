<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Want to see the work beyond the repositories? Explore my portfolio at harshitha-portfolio-inky.vercel.app">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f22"/>
      <stop offset="1" stop-color="#1b1036"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#c38bff"/>
    </linearGradient>
    <radialGradient id="g" cx="0.85" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b44cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b44cff" stop-opacity="0"/>
    </radialGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .arrow{animation:nudge 2.4s ease-in-out infinite}
      @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="198" rx="18" fill="url(#bg)" stroke="url(#edge)" stroke-opacity="0.55"/>
  <rect x="1" y="1" width="1198" height="198" rx="18" fill="url(#g)"/>
  <text x="64" y="72" font-size="13" letter-spacing="4" fill="#9aa7ff" font-weight="600">PORTFOLIO</text>
  <text x="64" y="116" font-size="30" font-weight="700" fill="#f1f3ff">Want to see the work beyond the repositories?</text>
  <text x="64" y="152" font-size="17" fill="#aab3d9">Case studies, publications, certifications and the stack in one place.</text>
  <g transform="translate(910 82)">
    <rect width="226" height="48" rx="24" fill="#f1f3ff" fill-opacity="0.08" stroke="#c9b6ff" stroke-opacity="0.6"/>
    <text x="30" y="30" font-size="16" font-weight="600" fill="#ffffff">Explore portfolio</text>
    <g class="arrow"><text x="178" y="31" font-size="18" fill="#c9b6ff">→</text></g>
  </g>
</svg>
